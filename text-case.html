<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Конвертер регистра текста — Online Tools</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --border: #2a2a32;
      --text: #f0f0f5;
      --muted: #a0a0b0;
      --accent: #06b6d4;
      --accent-hover: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    textarea {
      width: 100%;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      color: var(--text);
      font-size: 1rem;
      min-height: 140px;
      resize: vertical;
      outline: none;
      margin-bottom: 1rem;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 500px) {
      .buttons { grid-template-columns: 1fr; }
    }
    .btn {
      background: #121216;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      border-color: var(--accent);
      background: rgba(6, 182, 212, 0.1);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f0f12;
      font-weight: 600;
      grid-column: 1 / -1;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .result-label {
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Назад к инструментам</a>
    <h1>Конвертер регистра</h1>
    <p class="subtitle">Быстро меняй регистр текста одним нажатием</p>

    <div class="card">
      <label for="input">Исходный текст</label>
      <textarea id="input" placeholder="Вставь сюда текст...">Пример текста для конвертации</textarea>

      <div class="buttons">
        <button class="btn" onclick="convert('upper')">ВЕРХНИЙ РЕГИСТР</button>
        <button class="btn" onclick="convert('lower')">нижний регистр</button>
        <button class="btn" onclick="convert('title')">Как В Заголовке</button>
        <button class="btn" onclick="convert('sentence')">Как в предложении</button>
        <button class="btn" onclick="convert('toggle')">иНВЕРСИЯ рЕГИСТРА</button>
        <button class="btn" onclick="convert('capitalize')">Каждое Слово С Большой</button>
      </div>
    </div>

    <div class="card">
      <label class="result-label">Результат</label>
      <textarea id="output" readonly placeholder="Здесь появится результат"></textarea>
      <button class="btn btn-primary" id="copyBtn">Скопировать результат</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');

    function convert(type) {
      const text = input.value;
      let result = '';

      switch (type) {
        case 'upper':
          result = text.toUpperCase();
          break;
        case 'lower':
          result = text.toLowerCase();
          break;
        case 'title':
          result = text.toLowerCase().replace(/(?:^|\s)\S/g, c => c.toUpperCase());
          break;
        case 'sentence':
          result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
          break;
        case 'toggle':
          result = text.split('').map(c => 
            c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()
          ).join('');
          break;
        case 'capitalize':
          result = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
          break;
      }

      output.value = result;
    }

    // Автоматически конвертируем при загрузке
    convert('title');

    copyBtn.addEventListener('click', () => {
      if (!output.value) return;
      navigator.clipboard.writeText(output.value).then(() => {
        copyBtn.textContent = 'Скопировано!';
        setTimeout(() => copyBtn.textContent = 'Скопировать результат', 2000);
      });
    });
  </script>
</body>
</html>
