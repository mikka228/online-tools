<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Case Converter — Online Tools</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #06b6d4;
      --accent-hover: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      color: var(--text);
      font-size: 1rem;
      min-height: 130px;
      resize: vertical;
      outline: none;
      margin-bottom: 1rem;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
    }
    @media (max-width: 500px) {
      .buttons { grid-template-columns: 1fr; }
    }
    .btn {
      background: #09090b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      border-color: var(--accent);
      background: rgba(6, 182, 212, 0.1);
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #09090b;
      font-weight: 600;
      grid-column: 1 / -1;
      margin-top: 0.5rem;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Back to tools</a>
    <h1>Text Case Converter</h1>
    <p class="subtitle">Change text case with one click</p>

    <div class="card">
      <label for="input">Original text</label>
      <textarea id="input" placeholder="Paste your text here...">Example text for conversion</textarea>

      <div class="buttons">
        <button class="btn" onclick="convert('upper')">UPPERCASE</button>
        <button class="btn" onclick="convert('lower')">lowercase</button>
        <button class="btn" onclick="convert('title')">Title Case</button>
        <button class="btn" onclick="convert('sentence')">Sentence case</button>
        <button class="btn" onclick="convert('toggle')">tOGGLE cASE</button>
        <button class="btn" onclick="convert('capitalize')">Capitalize Each Word</button>
      </div>
    </div>

    <div class="card">
      <label>Result</label>
      <textarea id="output" readonly placeholder="Result will appear here"></textarea>
      <button class="btn btn-primary" id="copyBtn">Copy Result</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');

    function convert(type) {
      const text = input.value;
      let result = '';

      switch (type) {
        case 'upper':
          result = text.toUpperCase();
          break;
        case 'lower':
          result = text.toLowerCase();
          break;
        case 'title':
          result = text.toLowerCase().replace(/(?:^|\s)\S/g, c => c.toUpperCase());
          break;
        case 'sentence':
          result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
          break;
        case 'toggle':
          result = text.split('').map(c => 
            c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()
          ).join('');
          break;
        case 'capitalize':
          result = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
          break;
      }

      output.value = result;
    }

    convert('title');

    copyBtn.addEventListener('click', () => {
      if (!output.value) return;
      navigator.clipboard.writeText(output.value).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy Result', 2000);
      });
    });
  </script>
</body>
</html>
