<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Formatter — Online Tools</title>
  <meta name="description" content="Format, minify and validate JSON instantly in your browser. Free, no signup." />
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #22c55e;
      --accent-hover: #4ade80;
      --danger: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-flex;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.45rem;
      font-weight: 500;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.45;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin: 1rem 0 0.5rem;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.1rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      background: var(--accent);
      color: #09090b;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: rgba(34, 197, 94, 0.08);
    }
    .status {
      min-height: 1.4rem;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      color: var(--muted);
    }
    .status.ok { color: var(--accent-hover); }
    .status.err { color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="index.html">← Back to tools</a>
    <h1>JSON Formatter</h1>
    <p class="subtitle">Format, minify and validate JSON in your browser</p>

    <div class="card">
      <label for="input">Input</label>
      <textarea id="input" placeholder='{"hello":"world"}'></textarea>

      <div class="actions">
        <button class="btn" id="formatBtn">Format</button>
        <button class="btn btn-secondary" id="minifyBtn">Minify</button>
        <button class="btn btn-secondary" id="validateBtn">Validate</button>
        <button class="btn btn-secondary" id="copyBtn">Copy result</button>
        <button class="btn btn-secondary" id="clearBtn">Clear</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <label for="output">Result</label>
      <textarea id="output" readonly placeholder="Formatted JSON will appear here"></textarea>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function setStatus(text, type) {
      status.textContent = text;
      status.className = 'status' + (type ? ' ' + type : '');
    }

    function parseJSON() {
      const raw = input.value.trim();
      if (!raw) {
        setStatus('Paste JSON first', 'err');
        return null;
      }
      try {
        return JSON.parse(raw);
      } catch (e) {
        setStatus('Invalid JSON: ' + e.message, 'err');
        return null;
      }
    }

    document.getElementById('formatBtn').onclick = () => {
      const data = parseJSON();
      if (data === null) return;
      output.value = JSON.stringify(data, null, 2);
      setStatus('Valid JSON · formatted', 'ok');
    };

    document.getElementById('minifyBtn').onclick = () => {
      const data = parseJSON();
      if (data === null) return;
      output.value = JSON.stringify(data);
      setStatus('Valid JSON · minified', 'ok');
    };

    document.getElementById('validateBtn').onclick = () => {
      const data = parseJSON();
      if (data === null) return;
      output.value = input.value.trim();
      setStatus('Valid JSON', 'ok');
    };

    document.getElementById('copyBtn').onclick = async () => {
      const text = output.value || input.value;
      if (!text.trim()) {
        setStatus('Nothing to copy', 'err');
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        setStatus('Copied', 'ok');
      } catch {
        setStatus('Could not copy', 'err');
      }
    };

    document.getElementById('clearBtn').onclick = () => {
      input.value = '';
      output.value = '';
      setStatus('');
    };
  </script>
</body>
</html>
