<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPEG to PDF — Online Tools</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #f97316;
      --accent-hover: #fb923c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 2.75rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(249, 115, 22, 0.05);
    }
    .dropzone strong { color: var(--accent-hover); }
    .dropzone p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }
    input[type="file"] { display: none; }
    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    .preview-item {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-item .remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #09090b;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .info {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.75rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Back to tools</a>
    <h1>JPEG to PDF</h1>
    <p class="subtitle">Convert images to PDF right in your browser</p>

    <div class="card">
      <div class="dropzone" id="dropzone">
        <div style="font-size: 2.4rem; margin-bottom: 0.6rem;">📄</div>
        <strong>Click or drop images here</strong>
        <p>JPG, PNG, WebP · multiple files supported</p>
        <input type="file" id="fileInput" accept="image/*" multiple />
      </div>

      <div class="preview" id="preview"></div>

      <button class="btn" id="convertBtn" disabled>Create PDF</button>
      <p class="info" id="info"></p>
    </div>
  </div>

  <script>
    const { jsPDF } = window.jspdf;
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const convertBtn = document.getElementById('convertBtn');
    const info = document.getElementById('info');

    let files = [];

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    function handleFiles(fileList) {
      for (let file of fileList) {
        if (!file.type.startsWith('image/')) continue;
        files.push(file);
      }
      renderPreview();
      convertBtn.disabled = files.length === 0;
      info.textContent = files.length ? `Selected files: ${files.length}` : '';
    }

    function renderPreview() {
      preview.innerHTML = '';
      files.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = 'preview-item';
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        const btn = document.createElement('button');
        btn.className = 'remove';
        btn.innerHTML = '×';
        btn.onclick = (e) => {
          e.stopPropagation();
          files.splice(index, 1);
          renderPreview();
          convertBtn.disabled = files.length === 0;
          info.textContent = files.length ? `Selected files: ${files.length}` : '';
        };
        div.appendChild(img);
        div.appendChild(btn);
        preview.appendChild(div);
      });
    }

    convertBtn.addEventListener('click', async () => {
      if (files.length === 0) return;
      convertBtn.disabled = true;
      convertBtn.textContent = 'Creating PDF...';

      try {
        const pdf = new jsPDF();
        let first = true;

        for (let file of files) {
          const dataUrl = await readFileAsDataURL(file);
          const img = await loadImage(dataUrl);

          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();

          let imgWidth = img.width;
          let imgHeight = img.height;
          const ratio = Math.min(pageWidth / imgWidth, pageHeight / imgHeight);
          imgWidth *= ratio;
          imgHeight *= ratio;

          const x = (pageWidth - imgWidth) / 2;
          const y = (pageHeight - imgHeight) / 2;

          if (!first) pdf.addPage();
          pdf.addImage(dataUrl, 'JPEG', x, y, imgWidth, imgHeight);
          first = false;
        }

        pdf.save('images.pdf');
        convertBtn.textContent = 'Create PDF';
        convertBtn.disabled = false;
      } catch (err) {
        alert('Error creating PDF');
        convertBtn.textContent = 'Create PDF';
        convertBtn.disabled = false;
      }
    });

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }
  </script>
</body>
</html>
