<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator — Online Tools</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1.15rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }
    .preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    #qrcode {
      background: white;
      padding: 18px;
      border-radius: 16px;
      line-height: 0;
      min-height: 200px;
      min-width: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qrcode img, #qrcode canvas {
      display: block;
      max-width: 100%;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Back to tools</a>
    <h1>QR Code Generator</h1>
    <p class="subtitle">Create a QR code in seconds</p>

    <div class="card">
      <label for="text">Text or URL</label>
      <textarea id="text" placeholder="https://example.com or any text">https://github.com/mikka228/online-tools</textarea>

      <div class="row">
        <div>
          <label for="size">Size</label>
          <select id="size">
            <option value="200">200 × 200</option>
            <option value="256" selected>256 × 256</option>
            <option value="300">300 × 300</option>
            <option value="400">400 × 400</option>
            <option value="512">512 × 512</option>
          </select>
        </div>
        <div>
          <label for="colorDark">QR Color</label>
          <input type="color" id="colorDark" value="#000000" style="padding: 0.35rem; height: 48px;" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="colorLight">Background</label>
          <input type="color" id="colorLight" value="#ffffff" style="padding: 0.35rem; height: 48px;" />
        </div>
        <div>
          <label for="errorCorrection">Error Correction</label>
          <select id="errorCorrection">
            <option value="L">Low (L)</option>
            <option value="M" selected>Medium (M)</option>
            <option value="Q">Quartile (Q)</option>
            <option value="H">High (H)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card preview">
      <div id="qrcode"></div>
      <button class="btn" id="downloadBtn">Download PNG</button>
    </div>
  </div>

  <script>
    const textEl = document.getElementById('text');
    const sizeEl = document.getElementById('size');
    const colorDarkEl = document.getElementById('colorDark');
    const colorLightEl = document.getElementById('colorLight');
    const errorCorrectionEl = document.getElementById('errorCorrection');
    const qrcodeEl = document.getElementById('qrcode');
    const downloadBtn = document.getElementById('downloadBtn');

    function generate() {
      const text = textEl.value.trim() || ' ';
      const size = parseInt(sizeEl.value);
      qrcodeEl.innerHTML = '';
      new QRCode(qrcodeEl, {
        text: text,
        width: size,
        height: size,
        colorDark: colorDarkEl.value,
        colorLight: colorLightEl.value,
        correctLevel: QRCode.CorrectLevel[errorCorrectionEl.value]
      });
    }

    [textEl, sizeEl, colorDarkEl, colorLightEl, errorCorrectionEl].forEach(el => {
      el.addEventListener('input', generate);
      el.addEventListener('change', generate);
    });

    generate();

    downloadBtn.addEventListener('click', function() {
      // Prefer canvas if available (more reliable)
      var canvas = qrcodeEl.querySelector('canvas');
      var img = qrcodeEl.querySelector('img');
      var dataUrl = null;

      if (canvas) {
        dataUrl = canvas.toDataURL('image/png');
      } else if (img && img.src) {
        dataUrl = img.src;
      }

      if (!dataUrl) {
        alert('QR code is not ready yet');
        return;
      }

      // Create temporary link for download
      var link = document.createElement('a');
      link.href = dataUrl;
      link.download = 'qrcode.png';
      
      // For mobile compatibility
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
