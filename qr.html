<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator — Online Tools</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #8b5cf6;
      --accent-hover: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
      transition: color 0.2s;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1.15rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }
    .preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    #qrcode {
      background: white;
      padding: 18px;
      border-radius: 16px;
      line-height: 0;
      min-height: 200px;
      min-width: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #qrcode img {
      display: block;
      max-width: 100%;
      border-radius: 4px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: rgba(139, 92, 246, 0.1);
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Назад к инструментам</a>
    <h1>QR Code Generator</h1>
    <p class="subtitle">Создай QR-код за несколько секунд</p>

    <div class="card">
      <label for="text">Текст или ссылка</label>
      <textarea id="text" placeholder="https://example.com или любой текст">https://github.com/mikka228/online-tools</textarea>

      <div class="row">
        <div>
          <label for="size">Размер</label>
          <select id="size">
            <option value="200">200 × 200</option>
            <option value="256" selected>256 × 256</option>
            <option value="300">300 × 300</option>
            <option value="400">400 × 400</option>
            <option value="512">512 × 512</option>
          </select>
        </div>
        <div>
          <label for="colorDark">Цвет QR</label>
          <input type="color" id="colorDark" value="#000000" style="padding: 0.35rem; height: 48px;" />
        </div>
      </div>

      <div class="row">
        <div>
          <label for="colorLight">Цвет фона</label>
          <input type="color" id="colorLight" value="#ffffff" style="padding: 0.35rem; height: 48px;" />
        </div>
        <div>
          <label for="errorCorrection">Коррекция ошибок</label>
          <select id="errorCorrection">
            <option value="L">Низкий (L)</option>
            <option value="M" selected>Средний (M)</option>
            <option value="Q">Высокий (Q)</option>
            <option value="H">Максимальный (H)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card preview">
      <div id="qrcode"></div>
      <div class="actions">
        <button class="btn" id="downloadBtn">Скачать PNG</button>
      </div>
    </div>
  </div>

  <script>
    const textEl = document.getElementById('text');
    const sizeEl = document.getElementById('size');
    const colorDarkEl = document.getElementById('colorDark');
    const colorLightEl = document.getElementById('colorLight');
    const errorCorrectionEl = document.getElementById('errorCorrection');
    const qrcodeEl = document.getElementById('qrcode');
    const downloadBtn = document.getElementById('downloadBtn');

    function generate() {
      const text = textEl.value.trim() || ' ';
      const size = parseInt(sizeEl.value);
      qrcodeEl.innerHTML = '';
      new QRCode(qrcodeEl, {
        text: text,
        width: size,
        height: size,
        colorDark: colorDarkEl.value,
        colorLight: colorLightEl.value,
        correctLevel: QRCode.CorrectLevel[errorCorrectionEl.value]
      });
    }

    [textEl, sizeEl, colorDarkEl, colorLightEl, errorCorrectionEl].forEach(el => {
      el.addEventListener('input', generate);
      el.addEventListener('change', generate);
    });

    generate();

    downloadBtn.addEventListener('click', () => {
      const img = qrcodeEl.querySelector('img');
      if (!img) return;
      const link = document.createElement('a');
      link.download = 'qrcode.png';
      link.href = img.src;
      link.click();
    });
  </script>
</body>
</html>
