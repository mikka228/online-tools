<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator — Strong Random Passwords</title>
<meta name="description" content="Generate strong random passwords with letters, numbers and symbols. Choose length and copy in one click. Free browser tool." />
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #a855f7;
      --accent-hover: #c084fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .password-box {
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.2rem;
      text-align: center;
      word-break: break-all;
      margin-bottom: 1.1rem;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.5px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 0.7rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    input[type="range"] {
      width: 100%;
      margin: 0.5rem 0 1.1rem;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }
    .row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .length-value {
      font-weight: 600;
      color: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Back to tools</a>
    <h1>Password Generator</h1>
    <p class="subtitle">Create strong passwords in one second</p>

    <div class="card">
      <div class="password-box" id="password">Click Generate</div>
      <button class="btn" id="generateBtn">Generate</button>
      <button class="btn btn-secondary" id="copyBtn">Copy</button>
    </div>

    <div class="card">
      <label>Password length: <span class="length-value" id="lengthValue">16</span></label>
      <input type="range" id="length" min="6" max="64" value="16" />

      <div class="row">
        <input type="checkbox" id="uppercase" checked />
        <label for="uppercase" style="margin:0">Uppercase (A-Z)</label>
      </div>
      <div class="row">
        <input type="checkbox" id="lowercase" checked />
        <label for="lowercase" style="margin:0">Lowercase (a-z)</label>
      </div>
      <div class="row">
        <input type="checkbox" id="numbers" checked />
        <label for="numbers" style="margin:0">Numbers (0-9)</label>
      </div>
      <div class="row">
        <input type="checkbox" id="symbols" checked />
        <label for="symbols" style="margin:0">Symbols (!@#$%^&*)</label>
      </div>
    </div>
  </div>

  <script>
    const passwordEl = document.getElementById('password');
    const lengthEl = document.getElementById('length');
    const lengthValue = document.getElementById('lengthValue');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');

    const uppercaseEl = document.getElementById('uppercase');
    const lowercaseEl = document.getElementById('lowercase');
    const numbersEl = document.getElementById('numbers');
    const symbolsEl = document.getElementById('symbols');

    lengthEl.addEventListener('input', () => {
      lengthValue.textContent = lengthEl.value;
    });

    function generatePassword() {
      const length = parseInt(lengthEl.value);
      let chars = '';
      if (uppercaseEl.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (lowercaseEl.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (numbersEl.checked) chars += '0123456789';
      if (symbolsEl.checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

      if (!chars) {
        passwordEl.textContent = 'Select at least one character type';
        return;
      }

      let password = '';
      const array = new Uint32Array(length);
      crypto.getRandomValues(array);
      for (let i = 0; i < length; i++) {
        password += chars[array[i] % chars.length];
      }
      passwordEl.textContent = password;
    }

    generateBtn.addEventListener('click', generatePassword);
    generatePassword();

    copyBtn.addEventListener('click', () => {
      const text = passwordEl.textContent;
      if (!text || text.includes('Select') || text.includes('Click')) return;
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 2000);
      });
    });
  </script>
</body>
</html>
