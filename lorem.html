<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lorem Ipsum Generator — Free Dummy Text</title>
  <meta name="description" content="Generate Lorem Ipsum placeholder text online. Choose paragraphs, sentences or words. Free browser tool, no signup." />
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #a78bfa;
      --accent-hover: #c4b5fd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .back {
      display: inline-flex;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.45rem;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      margin-bottom: 0.9rem;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea {
      min-height: 220px;
      font-size: 0.95rem;
      line-height: 1.55;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.1rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      background: var(--accent);
      color: #09090b;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .status {
      margin-top: 0.7rem;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="index.html">← Back to tools</a>
    <h1>Lorem Ipsum Generator</h1>
    <p class="subtitle">Generate placeholder text for designs and mockups</p>

    <div class="card">
      <div class="row">
        <div>
          <label for="type">Type</label>
          <select id="type">
            <option value="paragraphs">Paragraphs</option>
            <option value="sentences">Sentences</option>
            <option value="words">Words</option>
          </select>
        </div>
        <div>
          <label for="count">Count</label>
          <input id="count" type="number" min="1" max="50" value="3" />
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="generateBtn">Generate</button>
        <button class="btn btn-secondary" id="copyBtn">Copy</button>
        <button class="btn btn-secondary" id="clearBtn">Clear</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <label for="output">Result</label>
      <textarea id="output" readonly placeholder="Generated text will appear here"></textarea>
    </div>
  </div>

  <script>
    const WORDS = [
      'lorem','ipsum','dolor','sit','amet','consectetur','adipiscing','elit','sed','do',
      'eiusmod','tempor','incididunt','ut','labore','et','dolore','magna','aliqua','ut',
      'enim','ad','minim','veniam','quis','nostrud','exercitation','ullamco','laboris','nisi',
      'ut','aliquip','ex','ea','commodo','consequat','duis','aute','irure','dolor',
      'in','reprehenderit','in','voluptate','velit','esse','cillum','dolore','eu','fugiat',
      'nulla','pariatur','excepteur','sint','occaecat','cupidatat','non','proident','sunt','in',
      'culpa','qui','officia','deserunt','mollit','anim','id','est','laborum','vitae',
      'dicta','sunt','explicabo','nemo','enim','ipsam','voluptatem','quia','voluptas','sit'
    ];

    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function word() {
      return WORDS[rand(0, WORDS.length - 1)];
    }

    function sentence() {
      const n = rand(6, 14);
      const list = [];
      for (let i = 0; i < n; i++) list.push(word());
      list[0] = list[0].charAt(0).toUpperCase() + list[0].slice(1);
      return list.join(' ') + '.';
    }

    function paragraph() {
      const n = rand(3, 6);
      const list = [];
      for (let i = 0; i < n; i++) list.push(sentence());
      return list.join(' ');
    }

    function generate() {
      const type = document.getElementById('type').value;
      let count = Number(document.getElementById('count').value);
      if (!Number.isFinite(count) || count < 1) count = 1;
      if (count > 50) count = 50;

      const parts = [];
      for (let i = 0; i < count; i++) {
        if (type === 'words') parts.push(word());
        else if (type === 'sentences') parts.push(sentence());
        else parts.push(paragraph());
      }

      if (type === 'words') output.value = parts.join(' ');
      else if (type === 'sentences') output.value = parts.join(' ');
      else output.value = parts.join('\n\n');

      status.textContent = 'Generated ' + count + ' ' + type;
    }

    document.getElementById('generateBtn').onclick = generate;
    document.getElementById('copyBtn').onclick = async () => {
      if (!output.value) {
        status.textContent = 'Nothing to copy';
        return;
      }
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = 'Copied';
      } catch {
        status.textContent = 'Copy failed';
      }
    };
    document.getElementById('clearBtn').onclick = () => {
      output.value = '';
      status.textContent = '';
    };

    generate();
  </script>
</body>
</html>
