<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Signature Generator — Online Tools</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #ec4899;
      --accent-hover: #f472b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.95rem;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
    }
    .preview-title {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1rem;
      font-weight: 500;
    }
    #preview {
      background: white;
      color: #222;
      padding: 1.35rem;
      border-radius: 12px;
      min-height: 150px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 0.7rem;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: rgba(236, 72, 153, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Назад к инструментам</a>
    <h1>Email Signature</h1>
    <p class="subtitle">Создай красивую подпись для почты за 30 секунд</p>

    <div class="layout">
      <div class="card">
        <label for="name">Имя и фамилия</label>
        <input type="text" id="name" value="Иван Иванов" />

        <label for="title">Должность</label>
        <input type="text" id="title" value="Frontend Developer" />

        <label for="company">Компания</label>
        <input type="text" id="company" value="My Company" />

        <label for="phone">Телефон</label>
        <input type="text" id="phone" value="+7 999 123-45-67" />

        <label for="email">Email</label>
        <input type="email" id="email" value="ivan@example.com" />

        <label for="website">Сайт</label>
        <input type="url" id="website" value="https://example.com" />

        <label for="color">Цвет акцента</label>
        <input type="color" id="color" value="#ec4899" style="padding: 0.3rem; height: 46px;" />
      </div>

      <div class="card">
        <div class="preview-title">Предпросмотр</div>
        <div id="preview"></div>

        <button class="btn" id="copyBtn">Скопировать HTML</button>
        <button class="btn btn-secondary" id="copyTextBtn">Скопировать как текст</button>
      </div>
    </div>
  </div>

  <script>
    const fields = ['name', 'title', 'company', 'phone', 'email', 'website', 'color'];
    const preview = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const copyTextBtn = document.getElementById('copyTextBtn');

    function updatePreview() {
      const name = document.getElementById('name').value || 'Имя';
      const title = document.getElementById('title').value;
      const company = document.getElementById('company').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const website = document.getElementById('website').value;
      const color = document.getElementById('color').value;

      let html = `
        <table cellpadding="0" cellspacing="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #333;">
          <tr>
            <td style="padding-right: 16px; border-right: 3px solid ${color};">
              <div style="font-size: 18px; font-weight: bold; color: #111;">${name}</div>
              \( {title ? `<div style="color: #555; margin-top: 2px;"> \){title}</div>` : ''}
              \( {company ? `<div style="color: #777; margin-top: 2px;"> \){company}</div>` : ''}
            </td>
            <td style="padding-left: 16px;">
              \( {phone ? `<div style="margin-bottom: 4px;">📞 <a href="tel: \){phone.replace(/\s/g,'')}" style="color: #333; text-decoration: none;">${phone}</a></div>` : ''}
              \( {email ? `<div style="margin-bottom: 4px;">✉️ <a href="mailto: \){email}" style="color: #333; text-decoration: none;">${email}</a></div>` : ''}
              \( {website ? `<div>🌐 <a href=" \){website}" style="color: \( {color}; text-decoration: none;"> \){website.replace(/^https?:\/\//, '')}</a></div>` : ''}
            </td>
          </tr>
        </table>
      `;
      preview.innerHTML = html;
    }

    fields.forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    updatePreview();

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(preview.innerHTML).then(() => {
        copyBtn.textContent = 'Скопировано!';
        setTimeout(() => copyBtn.textContent = 'Скопировать HTML', 2000);
      });
    });

    copyTextBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(preview.innerText).then(() => {
        copyTextBtn.textContent = 'Скопировано!';
        setTimeout(() => copyTextBtn.textContent = 'Скопировать как текст', 2000);
      });
    });
  </script>
</body>
</html>
