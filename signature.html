<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Signature Generator — Online Tools</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a20;
      --border: #2a2a32;
      --text: #f0f0f5;
      --muted: #a0a0b0;
      --accent: #ec4899;
      --accent-hover: #f472b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input, select {
      width: 100%;
      background: #121216;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
    }
    .preview-title {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    #preview {
      background: white;
      color: #222;
      padding: 1.25rem;
      border-radius: 10px;
      min-height: 160px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      margin-top: 1rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 0.75rem;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: rgba(236, 72, 153, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Назад к инструментам</a>
    <h1>Email Signature Generator</h1>
    <p class="subtitle">Создай красивую подпись для почты за 30 секунд</p>

    <div class="layout">
      <!-- Форма -->
      <div class="card">
        <label for="name">Имя и фамилия</label>
        <input type="text" id="name" placeholder="Иван Иванов" value="Иван Иванов" />

        <label for="title">Должность</label>
        <input type="text" id="title" placeholder="Frontend Developer" value="Frontend Developer" />

        <label for="company">Компания</label>
        <input type="text" id="company" placeholder="My Company" value="My Company" />

        <label for="phone">Телефон</label>
        <input type="text" id="phone" placeholder="+7 999 123-45-67" value="+7 999 123-45-67" />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="ivan@example.com" value="ivan@example.com" />

        <label for="website">Сайт</label>
        <input type="url" id="website" placeholder="https://example.com" value="https://example.com" />

        <label for="color">Цвет акцента</label>
        <input type="color" id="color" value="#ec4899" style="padding: 0.35rem; height: 44px;" />
      </div>

      <!-- Предпросмотр -->
      <div class="card">
        <div class="preview-title">Предпросмотр</div>
        <div id="preview"></div>

        <button class="btn" id="copyBtn">Скопировать HTML</button>
        <button class="btn btn-secondary" id="copyTextBtn">Скопировать как текст</button>
      </div>
    </div>
  </div>

  <script>
    const fields = ['name', 'title', 'company', 'phone', 'email', 'website', 'color'];
    const preview = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const copyTextBtn = document.getElementById('copyTextBtn');

    function updatePreview() {
      const name = document.getElementById('name').value || 'Имя';
      const title = document.getElementById('title').value;
      const company = document.getElementById('company').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const website = document.getElementById('website').value;
      const color = document.getElementById('color').value;

      let html = `
        <table cellpadding="0" cellspacing="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #333;">
          <tr>
            <td style="padding-right: 16px; border-right: 3px solid ${color};">
              <div style="font-size: 18px; font-weight: bold; color: #111;">${name}</div>
              \( {title ? `<div style="color: #555; margin-top: 2px;"> \){title}</div>` : ''}
              \( {company ? `<div style="color: #777; margin-top: 2px;"> \){company}</div>` : ''}
            </td>
            <td style="padding-left: 16px;">
              \( {phone ? `<div style="margin-bottom: 4px;">📞 <a href="tel: \){phone.replace(/\s/g,'')}" style="color: #333; text-decoration: none;">${phone}</a></div>` : ''}
              \( {email ? `<div style="margin-bottom: 4px;">✉️ <a href="mailto: \){email}" style="color: #333; text-decoration: none;">${email}</a></div>` : ''}
              \( {website ? `<div>🌐 <a href=" \){website}" style="color: \( {color}; text-decoration: none;"> \){website.replace(/^https?:\/\//, '')}</a></div>` : ''}
            </td>
          </tr>
        </table>
      `;
      preview.innerHTML = html;
    }

    fields.forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    updatePreview();

    copyBtn.addEventListener('click', () => {
      const html = preview.innerHTML;
      navigator.clipboard.writeText(html).then(() => {
        copyBtn.textContent = 'Скопировано!';
        setTimeout(() => copyBtn.textContent = 'Скопировать HTML', 2000);
      });
    });

    copyTextBtn.addEventListener('click', () => {
      const text = preview.innerText;
      navigator.clipboard.writeText(text).then(() => {
        copyTextBtn.textContent = 'Скопировано!';
        setTimeout(() => copyTextBtn.textContent = 'Скопировать как текст', 2000);
      });
    });
  </script>
</body>
</html>
