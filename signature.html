<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Signature Generator — Free Online Tool</title>
  <meta name="description" content="Create a clean email signature in seconds. Add name, title, phone and social links with live preview. Free, no signup." />
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
      --accent: #ec4899;
      --accent-hover: #f472b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .back:hover { color: var(--accent-hover); }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    input {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 0.95rem;
      color: var(--text);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    .preview-title {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 1rem;
      font-weight: 500;
    }
    #preview {
      background: white;
      color: #222;
      padding: 1.35rem;
      border-radius: 12px;
      min-height: 150px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      margin-top: 0.7rem;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      background: rgba(236, 72, 153, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Back to tools</a>
    <h1>Email Signature</h1>
    <p class="subtitle">Create a beautiful email signature in 30 seconds</p>

    <div class="layout">
      <div class="card">
        <label for="name">Full Name</label>
        <input type="text" id="name" value="John Smith">

        <label for="title">Job Title</label>
        <input type="text" id="title" value="Frontend Developer">

        <label for="company">Company</label>
        <input type="text" id="company" value="My Company">

        <label for="phone">Phone</label>
        <input type="text" id="phone" value="+1 555 123-4567">

        <label for="email">Email</label>
        <input type="email" id="email" value="john@example.com">

        <label for="website">Website</label>
        <input type="url" id="website" value="https://example.com">

        <label for="color">Accent Color</label>
        <input type="color" id="color" value="#ec4899" style="padding: 0.3rem; height: 46px;">
      </div>

      <div class="card">
        <div class="preview-title">Preview</div>
        <div id="preview"></div>

        <button class="btn" id="copyBtn">Copy HTML</button>
        <button class="btn btn-secondary" id="copyTextBtn">Copy as Text</button>
      </div>
    </div>
  </div>

  <script>
    function updatePreview() {
      var name = document.getElementById('name').value || 'Name';
      var title = document.getElementById('title').value;
      var company = document.getElementById('company').value;
      var phone = document.getElementById('phone').value;
      var email = document.getElementById('email').value;
      var website = document.getElementById('website').value;
      var color = document.getElementById('color').value;

      var html = '<table cellpadding="0" cellspacing="0" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #333;">';
      html += '<tr><td style="padding-right: 16px; border-right: 3px solid ' + color + ';">';
      html += '<div style="font-size: 18px; font-weight: bold; color: #111;">' + name + '</div>';
      if (title) html += '<div style="color: #555; margin-top: 2px;">' + title + '</div>';
      if (company) html += '<div style="color: #777; margin-top: 2px;">' + company + '</div>';
      html += '</td><td style="padding-left: 16px;">';
      if (phone) html += '<div style="margin-bottom: 4px;">📞 <a href="tel:' + phone.replace(/\s/g,'') + '" style="color: #333; text-decoration: none;">' + phone + '</a></div>';
      if (email) html += '<div style="margin-bottom: 4px;">✉️ <a href="mailto:' + email + '" style="color: #333; text-decoration: none;">' + email + '</a></div>';
      if (website) {
        var siteName = website.replace(/^https?:\/\//, '');
        html += '<div>🌐 <a href="' + website + '" style="color: ' + color + '; text-decoration: none;">' + siteName + '</a></div>';
      }
      html += '</td></tr></table>';

      document.getElementById('preview').innerHTML = html;
    }

    var fields = ['name', 'title', 'company', 'phone', 'email', 'website', 'color'];
    for (var i = 0; i < fields.length; i++) {
      document.getElementById(fields[i]).addEventListener('input', updatePreview);
    }

    updatePreview();

    document.getElementById('copyBtn').addEventListener('click', function() {
      var html = document.getElementById('preview').innerHTML;
      navigator.clipboard.writeText(html).then(function() {
        var btn = document.getElementById('copyBtn');
        btn.textContent = 'Copied!';
        setTimeout(function() { btn.textContent = 'Copy HTML'; }, 2000);
      });
    });

    document.getElementById('copyTextBtn').addEventListener('click', function() {
      var text = document.getElementById('preview').innerText;
      navigator.clipboard.writeText(text).then(function() {
        var btn = document.getElementById('copyTextBtn');
        btn.textContent = 'Copied!';
        setTimeout(function() { btn.textContent = 'Copy as Text'; }, 2000);
      });
    });
  </script>
</body>
</html>
